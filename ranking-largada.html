:root { color-scheme: light; }
* { box-sizing: border-box; }
body.mst-body { margin:0; font-family:'Gotham','Noto Sans',sans-serif; background:#e9e8e4; color:#1a1a1a; }

.mst-wrap { max-width: 920px; margin: 0 auto; padding: 18px 14px 60px; }

.mst-masthead { width:100%; display:block; border-radius:10px; }

.mst-panel { background:#fff; border-radius: 10px; margin-top: 12px; padding: 20px 22px 22px; }

.mst-filterbar {
  display:flex; flex-wrap: wrap; gap: 22px 32px; align-items:flex-start;
  padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid #eee;
}
.mst-filtergroup { display:flex; flex-direction:column; gap: 8px; }
.mst-filterlabel {
  font-size: 10.5px; font-weight:800; color:#999; text-transform:uppercase; letter-spacing:.07em;
}

.mst-page-title { font-size: 15px; font-weight:800; color:#000; margin:0 0 5px; letter-spacing:.2px; }
.mst-page-sub { font-weight:400; font-size: 11.5px; color:#5a5a5a; margin:0 0 16px; line-height:1.5; max-width: 640px; }

.mst-tabbar { display:flex; gap:5px; background:#f0efeb; border-radius:9px; padding:4px; width:fit-content; flex-wrap: wrap; }
.mst-tabbar button {
  appearance:none; border:none; background:transparent; color:#5a5a5a; font-size:12.5px; font-weight:700;
  padding:8px 16px; border-radius:6px; cursor:pointer; font-family:inherit; white-space:nowrap;
}
.mst-tabbar button.active { background:#000; color:#fff; }
.mst-tabbar button:hover:not(.active) { color:#000; }

.mst-catrow { display:flex; gap:8px; flex-wrap: wrap; }
.mst-cat {
  appearance:none; border:1.6px solid #ddd; background:#fff; color:#5a5a5a; font-size:12px; font-weight:800;
  padding:8px 16px; border-radius:999px; cursor:pointer; font-family:inherit; white-space:nowrap;
}
.mst-cat.active { color:#fff; border-color:transparent; }
.mst-cat.active.diamante { background:#29ABE2; }
.mst-cat.active.ouro { background:#b8860b; }
.mst-cat.active.prata { background:#8a8a8a; }

.mst-toolbar { display:flex; gap:12px; align-items:center; margin-bottom: 12px; }
.mst-search {
  flex:1; font-family:inherit; font-size:12.5px; padding:8px 12px; border-radius:7px;
  border:1.4px solid #000; background:#fff; color:#1a1a1a;
}
.mst-search:focus { outline: 2px solid #000; outline-offset: -1px; }
.mst-count { font-size:11px; color:#999; white-space:nowrap; font-weight:600; }

table.rank { width:100%; border-collapse:collapse; table-layout:fixed; }
table.rank th {
  position: sticky; top: 0; background:#000; color:#fff; font-size:10.5px; font-weight:700; padding:9px 6px;
  text-align:center; border:none; letter-spacing:.1px; line-height:1.2;
}
table.rank td { padding:9px 8px; font-size:12px; border:none; background:#fff; text-align:center; word-wrap:break-word; }
table.rank tr:nth-child(even) td { background:#f5f5f3; }
table.rank tbody tr:hover td { background:#eef7fc; }
table.rank td.neg { color:#b5432a; font-weight:600; }

<script>
(function () {
  const DATA = JSON.parse(document.getElementById('mst-data').textContent);
  const state = { campanha: 'Crescendo', tipo: 'Assessor', cat: 'Diamante', q: '' };

  function key() { return state.campanha + '_' + state.tipo + '_' + state.cat; }

  function buildHead() {
    const isV = state.campanha === 'Virtuose';
    const nameLabel = state.tipo === 'Assessor' ? 'Assessor' : 'Filial';
    let html = '<th style="width:48px">Pos.</th>';
    if (isV) html += '<th style="width:48px">Rank</th>';
    html += `<th>${nameLabel}</th>`;
    if (isV) html += '<th style="width:118px">Pontuação<br>de Largada</th>';
    html += '<th style="width:108px">Pontuação</th>';
    html += '<th class="prem-col" style="width:150px">Premiação</th>';
    document.getElementById('mst-thead-row').innerHTML = html;
  }

  function render() {
    const rows = DATA[key()] || [];
    const q = state.q.trim().toLowerCase();
    const filtered = q ? rows.filter(r => r.nome.toLowerCase().includes(q)) : rows;
    const isV = state.campanha === 'Virtuose';

    buildHead();

    document.getElementById('mst-page-title').textContent = `${state.campanha} — ${state.tipo === 'Assessor' ? 'Assessor' : 'Filial'} ${state.cat}`;
    document.getElementById('mst-page-sub').textContent = isV
      ? 'PL médio diário ponderado, calculado no período de agosto/2026, comparado à Pontuação de Largada fixada em 31/07/2026 (abaixo dela, aparece em vermelho). Ranking Mensal — Base 03.08.2026.'
      : 'Pontuação apurada dentro do período de Agosto/2026. Categoria fixada na abertura da campanha (31/07/2026); resgates líquidos aparecem em vermelho. Ranking Mensal — Base 03.08.2026.';

    const tbody = document.getElementById('mst-tbody');
    const empty = document.getElementById('mst-empty');
    tbody.innerHTML = '';

    if (filtered.length === 0) {
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      const frag = document.createDocumentFragment();
      filtered.forEach(r => {
        const tr = document.createElement('tr');
        let html = `<td class="pos-col">${r.posicao}</td>`;
        if (isV) {
          html += `<td class="${r.rank_tier ? '' : 'dash'}">${r.rank_tier || '—'}</td>`;
        }
        html += `<td>${r.nome}</td>`;
        if (isV) {
          html += `<td>${r.largada || ''}</td>`;
        }
        const pontClass = r.neg ? 'neg' : '';
        html += `<td class="${pontClass}">${r.pontuacao}</td>`;
        // Regra: no Crescendo, quem está com pontuação negativa (net negativo) não recebe premiação,
        // independentemente do que a base de origem trazia.
        const semPremio = !isV && r.neg;
        const prem = semPremio ? '—' : (r.premiacao || '—');
        html += `<td class="prem${prem === '—' ? ' dash' : ''}">${prem}</td>`;
        tr.innerHTML = html;
        frag.appendChild(tr);
      });
      tbody.appendChild(frag);
    }

    document.getElementById('mst-count').textContent = filtered.length + (q ? ` de ${rows.length}` : '') + (filtered.length === 1 ? ' resultado' : ' resultados');
  }

  function wireTabs(containerId, attr, k) {
    document.getElementById(containerId).addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      document.querySelectorAll(`#${containerId} button`).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state[k] = btn.getAttribute(attr);
      render();
    });
  }

  wireTabs('mst-campanha-tabs', 'data-campanha', 'campanha');
  wireTabs('mst-tipo-tabs', 'data-tipo', 'tipo');
  wireTabs('mst-cat-tabs', 'data-cat', 'cat');

  document.getElementById('mst-search').addEventListener('input', (e) => {
    state.q = e.target.value;
    render();
  });

  render();
})();
</script>

<script>
/* Deep link: abre a página já no recorte pedido pela URL.
   ?campanha=Crescendo|Virtuose  &tipo=Assessor|Filiais  &cat=Diamante|Ouro|Prata  &q=nome
   Clicar no botão é de propósito: o estado da página vive num closure e só muda pelos
   handlers de clique, então simular o clique reaproveita a lógica existente sem duplicá-la. */
(function aplicarFiltrosDaURL(){
  const bruto = window.location.search || window.location.hash.replace(/^#/, '?');
  if (!bruto) return;
  const p = new URLSearchParams(bruto);
  const clicar = (containerId, attr, valor) => {
    if (!valor) return;
    const btn = document.querySelector(`#${containerId} button[${attr}="${CSS.escape(valor)}"]`);
    if (btn) btn.click();
  };
  clicar('mst-campanha-tabs', 'data-campanha', p.get('campanha'));
  clicar('mst-tipo-tabs',     'data-tipo',     p.get('tipo'));
  clicar('mst-cat-tabs',      'data-cat',      p.get('cat'));
  const q = p.get('q');
  if (q) {
    const busca = document.getElementById('mst-search');
    if (busca) { busca.value = q; busca.dispatchEvent(new Event('input', { bubbles: true })); }
  }
})();
</script>
